# Builds the archives of a release of mocoal and attaches them to it. A release is made by hand on
# GitHub: Releases > Draft a new release, a new tag vX.Y.Z (X.Y.Z: the version in Cargo.toml of the
# commit), Target: the commit (a branch or Recent commits), Publish release. Publishing makes the
# tag and starts this workflow, which
# - checks that the commit is on master and that the tag is v + the version in Cargo.toml;
# - builds and tests the program and the shared library for Linux x86_64, macOS (Apple silicon) and
#   Windows x86_64 with build.yml: 6 archives;
# - makes the complete source, mocoal-rs-X.Y.Z-src.tar.gz: the tree of the commit, the parser crates
#   of OpenModelica (scripts/fetch-omc.sh) and the crates.io dependencies (cargo vendor). It builds
#   without network access, and is tested so;
# - attaches the archives and SHA256SUMS of them to the release.
# When a step fails, the release becomes a draft again (the tag stays): fix, delete the draft and
# the tag, and release again.
#
# A dry run builds everything and attaches nothing: Actions > Release > Run workflow (input: the
# commit, empty for the head of master), or a pull request that changes this file. A pushed tag
# starts nothing.
name: Release

on:
  pull_request:
    paths: [".github/workflows/release.yml"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      commit:
        description: Commit on master for a dry run (empty for the head of master)
        type: string
        default: ""

# One release run at a time.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    name: Commit, version and tag
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.check.outputs.sha }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit, version and tag
        id: check
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          case "$GITHUB_EVENT_NAME" in
            pull_request) sha=$(git rev-parse HEAD) ;;
            release) sha=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}") ;;
            *)
              if ! sha=$(git rev-parse --verify --quiet "${COMMIT:-origin/master}^{commit}"); then
                echo "::error::no such commit: $COMMIT"
                exit 1
              fi
              ;;
          esac
          if [ "$GITHUB_EVENT_NAME" != pull_request ] && ! git merge-base --is-ancestor "$sha" origin/master; then
            echo "::error::$sha is not on master"
            exit 1
          fi
          version=$(git show "$sha:Cargo.toml" | sed -n 's/^version = "\(.*\)"$/\1/p' | head -1)
          tag="v$version"
          if [ "$GITHUB_EVENT_NAME" = release ]; then
            if [ "$RELEASE_TAG" != "$tag" ]; then
              echo "::error::the tag $RELEASE_TAG is not v + the version in Cargo.toml of $sha ($version)"
              exit 1
            fi
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "::warning::the tag $tag exists: change the version in Cargo.toml before a release"
          fi
          echo "event $GITHUB_EVENT_NAME, commit $sha, version $version, tag $tag"
          {
            echo "sha=$sha"
            echo "version=$version"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    with:
      all_platforms: true
      ref: ${{ needs.check.outputs.sha }}

  sources:
    name: Source archive
    needs: check
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.sha }}

      - name: Archive
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          name="mocoal-rs-$VERSION"
          tree="$RUNNER_TEMP/src/$name"
          mkdir -p "$tree" dist
          git archive HEAD | tar -x -C "$tree"
          (cd "$tree" && scripts/fetch-omc.sh)
          (cd "$tree" && mkdir -p .cargo && cargo vendor --locked vendor > .cargo/config.toml)
          tar -czf "dist/$name-src.tar.gz" -C "$RUNNER_TEMP/src" "$name"
          ls -la dist

      - name: The archive builds offline
        run: |
          mkdir "$RUNNER_TEMP/try"
          tar -xzf dist/*-src.tar.gz -C "$RUNNER_TEMP/try"
          cd "$RUNNER_TEMP"/try/*
          CARGO_HOME="$RUNNER_TEMP/cargo-home" cargo build --release --offline --locked
          scripts/check.sh all

      - uses: actions/upload-artifact@v4
        with:
          name: mocoal-src
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  attach:
    name: Attach to the release
    needs: [check, build, sources]
    if: github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mocoal-*
          path: dist
          merge-multiple: true

      - name: SHA-256 sums
        shell: bash
        run: |
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Attach
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  # No published release without its archives.
  unpublish:
    name: Back to a draft
    needs: [check, build, sources, attach]
    if: failure() && github.event_name == 'release'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          echo "::error::the release $TAG is a draft again; the tag $TAG stays"
