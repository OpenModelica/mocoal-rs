[package]
name = "mocoal"
version = "0.1.0"
edition = "2024"
authors = ["John Tinnerholm <jtinnerholm@gmail.com>"]
license = "AGPL-3.0-only OR LicenseRef-OSMC-PL-1.8"
description = "Gives the components of a Modelica model a Placement and its connections a Line"
publish = false

[lib]
name = "mocoal"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "mocoal"
path = "src/main.rs"

[dependencies]
openmodelica_ast = { path = "omc/OMCompiler/Compiler/OpenModelica.rs/openmodelica_ast" }
metamodelica = { workspace = true }

# The crates in omc/ inherit these, as they do in the workspace of the Rust omc
# (OMCompiler/Compiler/OpenModelica.rs/Cargo.toml).
[workspace]
resolver = "3"

[workspace.dependencies]
arcstr = "1.2.0"
const-str = "1.1.0"
encoding_rs = "0.8.41"
winnow = "1.0"
loop_unwrap = "0.2.0"
ordered-float = "5.5.0"
num-traits = "0.2.19"
libc = "0.2"
metamodelica = { path = "omc/OMCompiler/Compiler/OpenModelica.rs/metamodelica" }
openmodelica_error = { path = "omc/OMCompiler/Compiler/OpenModelica.rs/openmodelica_error" }
openmodelica_wasi = { path = "omc/OMCompiler/Compiler/OpenModelica.rs/openmodelica_wasi" }

# As in the Rust omc: MetaModelica integers wrap.
[profile.dev]
overflow-checks = false

[profile.release]
lto = "thin"
codegen-units = 1
